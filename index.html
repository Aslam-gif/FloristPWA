<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2d5a27">
    <title>Petal & Stem | Artisan Florist</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="navbar">
        <div class="logo">Petal & Stem</div>
        <div class="nav-links">
            <a href="#">Shop</a>
            <a href="#">Occasions</a>
            <div class="cart-icon">
                🛒 <span id="cart-count">0</span>
            </div>
        </div>
    </nav>

    <header class="hero">
        <div class="hero-content">
            <h1>Freshness Delivered to Your Door</h1>
            <p>Hand-crafted bouquets by local artisans.</p>
            <button class="btn-primary">Shop Collection</button>
        </div>
    </header>

    <section class="container">
        <h2 class="section-title">Seasonal Favorites</h2>
        <div class="product-grid" id="product-grid">
            <div class="card">
                <div class="badge">Best Seller</div>
                <img src="spring.webp" alt="Tulips">
                <div class="card-info">
                    <h3>Pastel Spring Mix</h3>
                    <p class="price">$55.00</p>
                    <button class="add-to-cart">Add to Cart</button>
                </div>
            </div>

            <div class="card">
                <img src="velvetrose.avif" alt="Roses">
                <div class="card-info">
                    <h3>Velvet Romance</h3>
                    <p class="price">$70.00</p>
                    <button class="add-to-cart">Add to Cart</button>
                </div>
            </div>

            <div class="card">
                <img src="sunflower.png" alt="Sunflowers">
                <div class="card-info">
                    <h3>Sunshine Glow</h3>
                    <p class="price">$40.00</p>
                    <button class="add-to-cart">Add to Cart</button>
                </div>
            </div>
        </div>
    </section>

    <script src="app.js"></script>
</body>
</html>

    <script src="app.js"></script>
</body>

</html>
